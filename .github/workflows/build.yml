# Host tests of the signal chain and the ESP-IDF firmware build
name: Build

on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/build.yml"]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make -C firmware/test/host

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # git describe gives the firmware version
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32
          path: firmware
          command: git config --global --add safe.directory '*' && idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/build/horchposten.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
